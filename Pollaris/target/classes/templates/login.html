<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
<div id="container">
    <h2>Login de usuário</h2>

    <p th:if="${erro}" th:text="${erro}" style="color: #ffcccc; font-weight: 700; text-align: center; margin: 0;"></p>

    <form th:action="@{/login}" method="POST" style="width: 100%; display: flex; flex-direction: column; gap: 24px; align-items: center;">

        <input type="email" name="email" placeholder="Digite seu email..." required>

        <div class="campo-senha-container">
            <input type="password" name="senha" placeholder="Digite sua senha..." required>
        </div>

        <button type="submit" class="btn-enviar">Enviar</button>
    </form>

    <a th:href="@{/cadastro}" class="link-cadastro">Não tem uma conta? Cadastre-se</a>
</div>
</body>

</html>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        /* Se a imagem for servida pelo Spring, idealmente ficaria: background: url('../imagens/background.jpg') ... */
        background-size: cover;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    #container {
        background: rgba(53, 85, 126, 0.75);
        backdrop-filter: blur(15px) saturate(120%);
        -webkit-backdrop-filter: blur(15px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        width: 440px;
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    h2 {
        color: #ffffff;
        font-size: 32px;
        font-weight: 800;
        margin: 0 0 10px 0;
        text-align: center;
        letter-spacing: -0.5px;
    }

    input {
        width: 100%;
        height: 60px;
        background-color: #2b2b2b;
        border: none;
        border-radius: 16px;
        padding: 0 20px;
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        outline: none;
        transition: background-color 0.2s ease;
    }

    input::placeholder {
        color: #757575;
        font-weight: 700;
    }

    input:focus {
        background-color: #333333;
    }

    .campo-senha-container {
        position: relative;
        width: 100%;
    }

    .campo-senha-container input {
        padding-right: 55px;
    }

    .btn-olho {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
        width: 24px;
        height: 24px;
        object-fit: contain;
        z-index: 10;
    }

    .btn-enviar {
        width: 100%;
        height: 48px;
        background-color: #e8f0fe;
        color: #1a2a40;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        font-weight: 800;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .btn-enviar:hover {
        background-color: #ffffff;
        transform: scale(1.02);
    }

    .btn-enviar:active {
        transform: scale(0.98);
        background-color: #d0e0fc;
    }

    .link-cadastro {
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        opacity: 0.8;
        transition: opacity 0.2s ease, text-decoration 0.2s ease;
        margin-top: 5px;
    }

    .link-cadastro:hover {
        opacity: 1;
        text-decoration: underline;
    }
</style>
