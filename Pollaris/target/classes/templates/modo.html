<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o modo</title>
</head>

<body>
<header id="cabecalho">
    <img th:src="@{/imagens/logu.jpeg}" alt="Urso Pollaris">
    <h1>Escolha o <span style="background: linear-gradient(90deg, #537499, #c0d0e2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Modo</span> </h1>
</header>

<div class="cards-container">
    <a th:href="@{/estudante}" class="card-opcao">
        <div class="icone"></div>
        <img th:src="@{/imagens/institucional.png}" alt="Student">
        <span>Institucional</span>
    </a>

    <a th:href="@{/criancas}" class="card-opcao">
        <div class="icone"></div>
        <img th:src="@{/imagens/infantil.png}" alt="Kids">
        <span>Infantil</span>
    </a>
</div>

</body>

</html>

<style>
    /* Mantive todo o seu CSS intacto! */
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-size: cover;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        overflow-x: hidden;
        padding: 40px 20px;
    }

    #cabecalho {
        text-align: center;
        margin-bottom: 30px;
        width: 100%;
    }

    #cabecalho img {
        width: 150px;
        height: auto;
        border-radius: 50%;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 75px;
        font-weight: 900;
        color: #537499;
        margin: 0 0 5px 0;
        letter-spacing: -2px;
        text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
    }

    .cards-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        width: 100%;
        max-width: 900px;
        margin: 40px auto 0 auto;
    }

    .card-opcao {
        background: rgba(44, 66, 99, 0.55);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 28px;
        width: 340px;
        height: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        cursor: pointer;
        padding: 30px;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        box-shadow: 0 12px 40px 0 rgba(19, 29, 43, 0.4);
        text-decoration: none;
    }

    .card-opcao img {
        width: 150px;
        height: auto;
        object-fit: contain;
        transition: transform 0.3s ease;
    }

    .card-opcao span {
        color: #ffffff;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        text-align: center;
    }

    .card-opcao:hover {
        transform: translateY(-10px);
        background: rgba(44, 66, 99, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 20px 50px 0 rgba(19, 29, 43, 0.5);
    }

    .card-opcao .icone {
        font-size: 60px;
        margin-bottom: 20px;
        transition: transform 0.3s ease;
    }

    .card-opcao:hover .icone {
        transform: scale(1.12);
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 50px;
        }

        .card-opcao {
            height: 280px;
            padding: 15px;
        }

        .card-opcao .icone {
            font-size: 45px;
        }

        .card-opcao span {
            font-size: 20px;
        }
    }
</style>
